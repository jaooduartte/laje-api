name: Sync LAJE-107 package lock

on:
  push:
    branches:
      - LAJE-107
    paths:
      - .github/workflows/sync-package-lock.yml

permissions:
  contents: write

jobs:
  sync-package-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: LAJE-107

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit regenerated lock file
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(LAJE-107): sync package lock"
          git push origin HEAD:LAJE-107
