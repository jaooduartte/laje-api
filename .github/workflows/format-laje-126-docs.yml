name: Format LAJE-126 Docs

on:
  push:
    branches:
      - LAJE-126
    paths:
      - ".github/workflows/format-laje-126-docs.yml"

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: LAJE-126
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed implementation and docs
        run: |
          npx prettier --write             docs/migration/data-migration.md             docs/migration/migration-runbook.md             docs/operational-workloads.md             scripts/migration/shared.ts             scripts/migration/sync-data.ts             src/modules/bracket-preview/bracket-preview.service.ts             src/operations/sql-script.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/migration/data-migration.md             docs/migration/migration-runbook.md             docs/operational-workloads.md             scripts/migration/shared.ts             scripts/migration/sync-data.ts             src/modules/bracket-preview/bracket-preview.service.ts             src/operations/sql-script.ts
          git commit -m "LAJE-126 format migration safeguards"
          git push origin HEAD:LAJE-126
