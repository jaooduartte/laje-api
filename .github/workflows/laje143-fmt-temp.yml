name: Format LAJE-143 rotation fix (temporary)

on:
  push:
    branches:
      - LAJE-143-rotation-validation-fix

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: LAJE-143-rotation-validation-fix
          persist-credentials: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - name: Format Terraform
        run: terraform fmt infra/aws/terraform/rds-rotation.tf
      - name: Commit formatting
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/aws/terraform/rds-rotation.tf
          if ! git diff --cached --quiet; then
            git commit -m "style(LAJE-143): apply Terraform fmt to rotation fixes"
            git push origin HEAD:LAJE-143-rotation-validation-fix
          fi
