name: Format LAJE-126

on:
  push:
    branches:
      - LAJE-126

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: LAJE-126
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format LAJE-126 files
        run: |
          npx prettier --write             docs/migration/supabase-inventory.md             docs/operational-workloads.md             src/config/environment.ts             src/integrations/aws/sqs.client.ts             src/modules/bracket-preview/bracket-preview.routes.ts             src/modules/bracket-preview/bracket-preview.runtime.ts             src/modules/bracket-preview/bracket-preview.service.ts             src/modules/calendar-subscription/calendar-ics.ts             src/modules/calendar-subscription/calendar-subscription.routes.ts             src/modules/notifications/reservation-email.service.ts             src/operations/apply-operational-migrations.ts             src/server.ts             tests/unit/bracket-preview.service.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "LAJE-126 apply Prettier formatting"
          git push origin HEAD:LAJE-126
