name: Format Debug

on:
  push:
    branches:
      - LAJE-82

permissions:
  contents: read

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show Prettier diff
        run: |
          npx prettier docs/architecture.md --write
          git diff -- docs/architecture.md
