name: Format LAJE-144 (temporary)

on:
  push:
    branches:
      - LAJE-144

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: LAJE-144
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format LAJE-144 files
        run: npx prettier --write src/modules/bracket-preview/bracket-preview.runtime.ts src/modules/bracket-preview/bracket-preview-message.ts scripts/ops/audit-bracket-preview-dlq.ts tests/unit/bracket-preview-message.test.ts docs/operations/aws-bracket-preview-dlq.md
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/modules/bracket-preview/bracket-preview.runtime.ts src/modules/bracket-preview/bracket-preview-message.ts scripts/ops/audit-bracket-preview-dlq.ts tests/unit/bracket-preview-message.test.ts docs/operations/aws-bracket-preview-dlq.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/bracket-preview/bracket-preview.runtime.ts src/modules/bracket-preview/bracket-preview-message.ts scripts/ops/audit-bracket-preview-dlq.ts tests/unit/bracket-preview-message.test.ts docs/operations/aws-bracket-preview-dlq.md
            git commit -m "style(LAJE-144): apply Prettier to audit tooling"
            git push origin HEAD:LAJE-144
          fi
