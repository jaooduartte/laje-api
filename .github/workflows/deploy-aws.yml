name: Deploy AWS

on:
  push:
    branches:
      - LAJE-136
    paths:
      - ".github/workflows/deploy-aws.yml"
      - "infra/aws/terraform/**"
      - "Dockerfile"
      - ".dockerignore"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy or suspend the staging runtime"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - suspend

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-aws-staging
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  TF_DIR: infra/aws/terraform
  TF_STATE_BUCKET: laje-terraform-state-549243453554-sa-east-1
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::549243453554:role/laje-github-actions-staging-deploy
  CORS_ORIGINS: https://laje-tcc.vercel.app

jobs:
  staging:
    name: Staging AWS
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Initialize Terraform state
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -reconfigure -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}"

      - name: Validate Terraform
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Resolve deployment action
        id: mode
        env:
          INPUT_ACTION: ${{ inputs.action }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "action=${INPUT_ACTION}" >> "${GITHUB_OUTPUT}"
          else
            echo "action=deploy" >> "${GITHUB_OUTPUT}"
          fi
          echo "image_tag=sha-${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

      - name: Suspend billable staging runtime
        if: steps.mode.outputs.action == 'suspend'
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="staging_api_enabled=false" \
            -var="staging_api_desired_count=0" \
            -var="staging_api_cors_origins=${CORS_ORIGINS}"

      - name: Provision staging foundation with zero tasks
        if: steps.mode.outputs.action == 'deploy'
        working-directory: ${{ env.TF_DIR }}
        env:
          IMAGE_TAG: ${{ steps.mode.outputs.image_tag }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="staging_api_enabled=true" \
            -var="staging_api_desired_count=0" \
            -var="staging_api_image_tag=${IMAGE_TAG}" \
            -var="staging_api_cors_origins=${CORS_ORIGINS}"

      - name: Login to Amazon ECR
        if: steps.mode.outputs.action == 'deploy'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable application image
        if: steps.mode.outputs.action == 'deploy'
        env:
          IMAGE_TAG: ${{ steps.mode.outputs.image_tag }}
        run: |
          ECR_REPOSITORY_URL="$(terraform -chdir="${TF_DIR}" output -raw staging_api_ecr_repository_url)"
          ECR_REPOSITORY_NAME="${ECR_REPOSITORY_URL##*/}"

          if aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY_NAME}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            >/dev/null 2>&1; then
            echo "Image ${IMAGE_TAG} already exists in ECR; reusing immutable image."
          else
            docker build --platform linux/amd64 --tag "${ECR_REPOSITORY_URL}:${IMAGE_TAG}" .
            docker push "${ECR_REPOSITORY_URL}:${IMAGE_TAG}"
          fi

      - name: Apply operational database migrations
        if: steps.mode.outputs.action == 'deploy'
        run: |
          CLUSTER_NAME="$(terraform -chdir="${TF_DIR}" output -raw staging_api_ecs_cluster_name)"
          TASK_DEFINITION="$(terraform -chdir="${TF_DIR}" output -raw staging_api_ecs_task_definition_arn)"
          SECURITY_GROUP="$(terraform -chdir="${TF_DIR}" output -raw ecs_security_group_id)"
          SUBNETS="$(terraform -chdir="${TF_DIR}" output -json public_subnet_ids | jq -r 'join(",")')"

          TASK_ARN="$(aws ecs run-task             --cluster "${CLUSTER_NAME}"             --task-definition "${TASK_DEFINITION}"             --launch-type FARGATE             --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}"             --overrides '{"containerOverrides":[{"name":"api","command":["node","dist/operations/apply-operational-migrations.js"]}]}'             --query 'tasks[0].taskArn'             --output text)"

          if [[ -z "${TASK_ARN}" || "${TASK_ARN}" == "None" ]]; then
            echo "Unable to start database migration task."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "${CLUSTER_NAME}" --tasks "${TASK_ARN}"

          EXIT_CODE="$(aws ecs describe-tasks             --cluster "${CLUSTER_NAME}"             --tasks "${TASK_ARN}"             --query 'tasks[0].containers[?name==`api`].exitCode | [0]'             --output text)"

          if [[ "${EXIT_CODE}" != "0" ]]; then
            aws ecs describe-tasks --cluster "${CLUSTER_NAME}" --tasks "${TASK_ARN}"
            echo "Operational database migrations failed with exit code ${EXIT_CODE}."
            exit 1
          fi

          echo "Operational database migrations completed."

      - name: Start one Fargate staging task
        if: steps.mode.outputs.action == 'deploy'
        working-directory: ${{ env.TF_DIR }}
        env:
          IMAGE_TAG: ${{ steps.mode.outputs.image_tag }}
        run: |
          terraform apply -auto-approve -input=false \
            -var="staging_api_enabled=true" \
            -var="staging_api_desired_count=1" \
            -var="staging_api_image_tag=${IMAGE_TAG}" \
            -var="staging_api_cors_origins=${CORS_ORIGINS}"

      - name: Validate HTTPS, PostgreSQL and CORS
        if: steps.mode.outputs.action == 'deploy'
        env:
          EXPECTED_ORIGIN: ${{ env.CORS_ORIGINS }}
        run: |
          API_URL="$(terraform -chdir="${TF_DIR}" output -raw staging_api_https_url)"
          echo "Validating staging API at ${API_URL}"

          for attempt in {1..60}; do
            if curl --fail --silent --show-error "${API_URL}/api/v1/health" >/tmp/health.json; then
              break
            fi
            if [[ "${attempt}" == "60" ]]; then
              echo "Application health endpoint did not become ready."
              exit 1
            fi
            sleep 10
          done

          curl --fail --silent --show-error "${API_URL}/api/v1/health/database" >/tmp/database-health.json

          headers="$(mktemp)"
          curl --fail --silent --show-error --dump-header "${headers}" --output /dev/null \
            --header "Origin: ${EXPECTED_ORIGIN}" \
            "${API_URL}/api/v1/health"

          grep -i -F "access-control-allow-origin: ${EXPECTED_ORIGIN}" "${headers}"

          echo "Application health: $(cat /tmp/health.json)"
          echo "Database health: $(cat /tmp/database-health.json)"
          echo "### LAJE staging" >> "${GITHUB_STEP_SUMMARY}"
          echo "- HTTPS endpoint: ${API_URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Application health: OK" >> "${GITHUB_STEP_SUMMARY}"
          echo "- PostgreSQL health: OK" >> "${GITHUB_STEP_SUMMARY}"
          echo "- CORS for Vercel production origin: OK" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run core E2E smoke
        if: steps.mode.outputs.action == 'deploy'
        run: |
          API_URL="$(terraform -chdir="${TF_DIR}" output -raw staging_api_https_url)"
          chmod +x scripts/smoke-staging.sh
          smoke_output="$(scripts/smoke-staging.sh "${API_URL}")"
          echo "${smoke_output}"
          echo "### Core E2E smoke" >> "${GITHUB_STEP_SUMMARY}"
          echo '~~~text' >> "${GITHUB_STEP_SUMMARY}"
          echo "${smoke_output}" >> "${GITHUB_STEP_SUMMARY}"
          echo '~~~' >> "${GITHUB_STEP_SUMMARY}"
