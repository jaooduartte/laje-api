name: LAJE-89 one-time formatter
on:
  push:
    branches: [LAJE-89]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: LAJE-89
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3.9.9 --write src/modules/realtime-read/realtime-read.routes.ts tests/unit/realtime-read.routes.test.ts src/routes/index.ts
      - name: Commit formatted code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/realtime-read/realtime-read.routes.ts tests/unit/realtime-read.routes.test.ts src/routes/index.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(LAJE-89): format realtime snapshots"
            git push origin HEAD:LAJE-89
          fi
