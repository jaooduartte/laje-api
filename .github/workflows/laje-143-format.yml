name: Format and lock LAJE-143 (temporary)

on:
  push:
    branches:
      - LAJE-143

permissions:
  contents: write

jobs:
  format-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: LAJE-143
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format JS and docs
        run: npx prettier --write infra/aws/lambda/rds-rotation-handler.mjs tests/unit/rds-rotation-handler.test.mjs docs/operations/aws-rds-rotation-ecs.md package.json
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - name: Format Terraform
        run: |
          terraform fmt infra/aws/terraform/rds-rotation.tf
          terraform fmt infra/aws/terraform/staging-api.tf
          terraform fmt infra/aws/terraform/versions.tf
      - name: Generate provider lock hashes
        working-directory: infra/aws/terraform
        run: |
          terraform init -backend=false -input=false -upgrade
          terraform providers lock -platform=linux_amd64 -platform=linux_arm64 -platform=darwin_amd64 -platform=darwin_arm64
          terraform validate
      - name: Commit formatting and provider lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/aws/lambda/rds-rotation-handler.mjs tests/unit/rds-rotation-handler.test.mjs docs/operations/aws-rds-rotation-ecs.md package.json infra/aws/terraform/rds-rotation.tf infra/aws/terraform/staging-api.tf infra/aws/terraform/versions.tf infra/aws/terraform/.terraform.lock.hcl
          if ! git diff --cached --quiet; then
            git commit -m "style(LAJE-143): format rotation automation and lock provider"
            git push origin HEAD:LAJE-143
          fi
