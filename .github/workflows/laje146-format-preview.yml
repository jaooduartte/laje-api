name: LAJE-146 Formatting Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/laje146-format-preview.yml"
permissions:
  contents: read

jobs:
  format-preview:
    name: Generate Prettier patch for isolated security change
    if: github.head_ref == 'LAJE-146' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Emit suggested Prettier patch (no writes to GitHub)
        run: |
          npx prettier docs/security-rate-limiting.md src/common/middlewares/rate-limit.middleware.ts src/modules/auth/auth.routes.ts src/modules/brackets/brackets.routes.ts tests/unit/rate-limit.middleware.test.ts --write
          git diff -- docs/security-rate-limiting.md src/common/middlewares/rate-limit.middleware.ts src/modules/auth/auth.routes.ts src/modules/brackets/brackets.routes.ts tests/unit/rate-limit.middleware.test.ts
