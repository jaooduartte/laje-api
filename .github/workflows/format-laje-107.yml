name: Format LAJE-107

on:
  push:
    branches:
      - LAJE-107
    paths:
      - .github/workflows/format-laje-107.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: LAJE-107

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: npm run format

      - name: Commit formatted files
        run: |
          if git diff --quiet; then
            echo "Files are already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/database-access.md src/config/environment.ts tests/unit/database-client.test.ts
          git commit -m "style(LAJE-107): format database layer changes"
          git push origin HEAD:LAJE-107
