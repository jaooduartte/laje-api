name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Normalize formatting
        run: npm run format

      - name: Commit normalized formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "LAJE-84 normalizar formatação"
            git push
          fi

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laje_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laje_api_test?sslmode=disable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  database-baseline:
    name: PostgreSQL Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laje_baseline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply PostgreSQL 17 baseline
        run: >-
          psql
          --host localhost
          --username postgres
          --dbname laje_baseline
          --set ON_ERROR_STOP=1
          --file infra/database/baseline/schema.sql

      - name: Validate PostgreSQL 17 baseline
        run: >-
          psql
          --host localhost
          --username postgres
          --dbname laje_baseline
          --set ON_ERROR_STOP=1
          --file infra/database/baseline/validate.sql

  container-image:
    name: Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build application image
        run: docker build --tag laje-api:ci .

      - name: Create isolated Docker network
        run: docker network create laje-ci

      - name: Start PostgreSQL dependency
        run: >-
          docker run -d
          --name laje-postgres
          --network laje-ci
          -e POSTGRES_USER=postgres
          -e POSTGRES_PASSWORD=postgres
          -e POSTGRES_DB=laje_api_test
          postgres:17

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec laje-postgres pg_isready -U postgres -d laje_api_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs laje-postgres
          exit 1

      - name: Start API container
        run: >-
          docker run -d
          --name laje-api
          --network laje-ci
          -p 3000:3000
          -e NODE_ENV=test
          -e PORT=3000
          -e DATABASE_URL=postgresql://postgres:postgres@laje-postgres:5432/laje_api_test?sslmode=disable
          -e CORS_ORIGINS=http://localhost:8080
          laje-api:ci

      - name: Validate container health endpoints
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/api/v1/health
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/database

      - name: Validate non-root runtime user
        run: |
          test "$(docker exec laje-api id -u)" != "0"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs laje-api || true
          docker logs laje-postgres || true
