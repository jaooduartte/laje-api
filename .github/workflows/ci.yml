name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      postgres_integration: ${{ steps.changes.outputs.postgres_integration }}
      database_baseline: ${{ steps.changes.outputs.database_baseline }}
      docker: ${{ steps.changes.outputs.docker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect extended validation changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "postgres_integration=true" >> "$GITHUB_OUTPUT"
            echo "database_baseline=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            git ls-tree -r --name-only "$head" > "$RUNNER_TEMP/changed-files.txt"
          else
            git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files.txt"
          fi

          postgres_integration=false
          database_baseline=false
          docker=false

          if grep -Eq '^(src/|tests/|infra/database/|scripts/migration/|package(-lock)?\.json$|tsconfig[^/]*\.json$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            postgres_integration=true
          fi

          if grep -Eq '^(src/|tests/flows/|infra/database/|scripts/migration/|package(-lock)?\.json$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            database_baseline=true
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] || grep -Eq '^(Dockerfile$|\.dockerignore$|src/|package(-lock)?\.json$|tsconfig[^/]*\.json$|\.github/workflows/ci\.yml$)' "$RUNNER_TEMP/changed-files.txt"; then
            docker=true
          fi

          echo "postgres_integration=$postgres_integration" >> "$GITHUB_OUTPUT"
          echo "database_baseline=$database_baseline" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: LAJE-150 inspect formatting
        run: |
          npx prettier src/modules/brackets/bracket-operations.routes.ts --write
          git diff -- src/modules/brackets/bracket-operations.routes.ts
          npx prettier docs/observability.md src/common/middlewares/observability.middleware.ts src/modules/observability/client-errors.routes.ts tests/unit/observability-terraform.test.mjs --write
          git diff -- docs/observability.md src/common/middlewares/observability.middleware.ts src/modules/observability/client-errors.routes.ts tests/unit/observability-terraform.test.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Smoke tests for three business flows
        run: npm run test:smoke

      - name: Build
        run: npm run build

  coverage:
    name: Full Backend Unit Coverage (75%)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 26.8.2 for full-source coverage
        uses: actions/setup-node@v7
        with:
          node-version: 26.8.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Measure backend unit coverage (75% line threshold)
        shell: bash
        env:
          COVERAGE_SUMMARY_JSON: coverage/backend/coverage-summary.json
        run: |
          set -o pipefail
          mkdir -p coverage/backend
          npm run test:coverage 2>&1 | tee coverage/backend/node-test-coverage.txt

      - name: Validate backend LCOV report
        run: |
          test -s coverage/backend/lcov.info
          grep -q '^SF:' coverage/backend/lcov.info
          grep -q '^end_of_record' coverage/backend/lcov.info

      - name: Validate SonarQube Cloud project variables
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.fork == false) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          test -n "$SONAR_ORGANIZATION" || { echo "::error::Set the SONAR_ORGANIZATION repository variable."; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "::error::Set the SONAR_PROJECT_KEY repository variable."; exit 1; }

      - name: SonarQube Cloud analysis
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.fork == false) ||
          (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Upload backend coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laje-api-backend-coverage
          path: coverage/backend/
          if-no-files-found: warn
          retention-days: 30

  coverage-comment:
    name: Publish Coverage Summary
    needs: coverage
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Download backend coverage report
        if: always() && (needs.coverage.result == 'success' || needs.coverage.result == 'failure')
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: laje-api-backend-coverage
          path: coverage/backend/

      - name: Create or update coverage comment
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("node:fs");
            const marker = "<!-- laje-api-coverage-summary -->";
            const summaryPath = "coverage/backend/coverage-summary.json";
            const threshold = 75;
            const resultLabels = {
              success: "✅ aprovado",
              failure: "❌ falhou",
              cancelled: "⏹️ cancelado",
              skipped: "⏭️ não executado",
            };
            const result = process.env.COVERAGE_RESULT;
            const formatMetric = (label, metric, minimum) => {
              if (
                !metric ||
                !Number.isFinite(metric.pct) ||
                metric.pct < 0 ||
                metric.pct > 100 ||
                !Number.isSafeInteger(metric.covered) ||
                metric.covered < 0 ||
                !Number.isSafeInteger(metric.total) ||
                metric.total < 0
              ) {
                return `- **${label}:** indisponível`;
              }

              const percentage = metric.pct.toLocaleString("pt-BR", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
              });
              const counts = `${metric.covered.toLocaleString("pt-BR")}/${metric.total.toLocaleString("pt-BR")}`;
              const thresholdLabel = minimum === undefined
                ? ""
                : ` — mínimo ${minimum}% ${metric.pct >= minimum ? "atingido" : "não atingido"}`;

              return `- **${label}:** ${percentage}% (${counts})${thresholdLabel}`;
            };

            let reportLines = ["Relatório de cobertura indisponível. Consulte o job de cobertura."];
            try {
              const summary = JSON.parse(fs.readFileSync(summaryPath, "utf8"));
              reportLines = [
                formatMetric("Linhas", summary.total?.lines, threshold),
                formatMetric("Branches", summary.total?.branches),
                formatMetric("Funções", summary.total?.functions),
              ];
            } catch {}

            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const body = [
              marker,
              "## 📊 Cobertura dos testes — API",
              "",
              `**Resultado da cobertura:** ${resultLabels[result] || "⚠️ indisponível"}`,
              "",
              ...reportLines,
              "",
              `[Ver execução da CI](https://github.com/${owner}/${repo}/actions/runs/${process.env.RUN_ID}) · Commit: \`${pullRequest.head.sha.slice(0, 7)}\``,
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullRequest.number,
              per_page: 100,
            });
            const existingComment = comments.find((comment) => comment.body?.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullRequest.number,
                body,
              });
            }

  postgres:
    name: PostgreSQL Validation
    needs: quality
    if: needs.quality.outputs.postgres_integration == 'true' || needs.quality.outputs.database_baseline == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laje_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laje_api_test?sslmode=disable
      CHAMPIONSHIP_RESET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laje_season_reset_test?sslmode=disable
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client for reset integration tests
        if: needs.quality.outputs.postgres_integration == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Prepare isolated championship reset database
        if: needs.quality.outputs.postgres_integration == 'true'
        run: |
          createdb --host localhost --username postgres laje_season_reset_test
          psql --host localhost --username postgres --dbname laje_season_reset_test --set ON_ERROR_STOP=1 --file infra/database/baseline/schema.sql

      - name: Run PostgreSQL integration tests
        if: needs.quality.outputs.postgres_integration == 'true'
        run: npm run test:integration

      - name: Install PostgreSQL client
        if: needs.quality.outputs.database_baseline == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create baseline database
        if: needs.quality.outputs.database_baseline == 'true'
        run: createdb --host localhost --username postgres laje_baseline

      - name: Apply PostgreSQL 17 baseline
        if: needs.quality.outputs.database_baseline == 'true'
        run: >-
          psql
          --host localhost
          --username postgres
          --dbname laje_baseline
          --set ON_ERROR_STOP=1
          --file infra/database/baseline/schema.sql

      - name: Validate PostgreSQL 17 baseline
        if: needs.quality.outputs.database_baseline == 'true'
        run: >-
          psql
          --host localhost
          --username postgres
          --dbname laje_baseline
          --set ON_ERROR_STOP=1
          --file infra/database/baseline/validate.sql

      - name: Apply incremental migrations
        if: needs.quality.outputs.database_baseline == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          migrations=(infra/database/migrations/*.sql)
          for migration in "${migrations[@]}"; do
            echo "Applying ${migration}"
            psql               --host localhost               --username postgres               --dbname laje_baseline               --set ON_ERROR_STOP=1               --file "${migration}"
          done

      - name: Validate LAJE-85 auth migration
        if: needs.quality.outputs.database_baseline == 'true'
        run: |
          test "$(psql --host localhost --username postgres --dbname laje_baseline --tuples-only --no-align --command "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace WHERE n.nspname = 'public' AND c.relkind = 'r' AND c.relname IN ('admin_auth_accounts', 'admin_auth_sessions');")" = "2"
          test "$(psql --host localhost --username postgres --dbname laje_baseline --tuples-only --no-align --command "SELECT count(*) FROM pg_constraint WHERE conname IN ('admin_auth_accounts_user_id_fkey', 'admin_auth_sessions_user_id_fkey');")" = "2"

      - name: Create isolated database for three priority business flows
        if: needs.quality.outputs.database_baseline == 'true'
        run: createdb --host localhost --username postgres --template laje_baseline laje_priority_flows

      - name: Validate three business flows against isolated PostgreSQL
        if: needs.quality.outputs.database_baseline == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laje_priority_flows?sslmode=disable
        run: npm run test:flows

      - name: Prepare synthetic migration source
        if: needs.quality.outputs.database_baseline == 'true'
        run: |
          createdb --host localhost --username postgres laje_migration_source
          psql --host localhost --username postgres --dbname laje_migration_source --set ON_ERROR_STOP=1 --file infra/database/baseline/schema.sql
          shopt -s nullglob
          source_migrations=(infra/database/migrations/*.sql)
          for migration in "${source_migrations[@]}"; do
            echo "Applying ${migration} to synthetic migration source"
            psql --host localhost --username postgres --dbname laje_migration_source --set ON_ERROR_STOP=1 --file "${migration}"
          done
          psql --host localhost --username postgres --dbname laje_migration_source --set ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.teams (id, name)
          VALUES ('00000000-0000-0000-0000-000000000001', 'Synthetic team');
          INSERT INTO public.league_events (id, name, event_type, organizer_type, event_date)
          VALUES ('00000000-0000-0000-0000-000000000002', 'Synthetic event', 'HH', 'LAJE', '2026-10-01');
          INSERT INTO public.league_event_reservation_requests (
            team_id, event_name, event_type, event_date, requester_name,
            requester_email, status, approved_league_event_id
          )
          SELECT '00000000-0000-0000-0000-000000000001',
                 'Synthetic event', 'HH', '2026-10-01',
                 'Synthetic requester ' || request_number,
                 'synthetic-' || request_number || '@example.invalid',
                 CASE WHEN request_number <= 23 THEN 'APPROVED'
                      WHEN request_number <= 25 THEN 'PENDING'
                      ELSE 'REJECTED' END::public.league_event_reservation_request_status,
                 CASE WHEN request_number <= 23
                      THEN '00000000-0000-0000-0000-000000000002'::uuid
                      ELSE NULL END
          FROM generate_series(1, 39) AS request_number;
          SQL

      - name: Rehearse synthetic migration and rollback guard
        if: needs.quality.outputs.database_baseline == 'true'
        env:
          MIGRATION_EXECUTION_CONTEXT: controlled
          MIGRATION_ALLOW_DESTINATION_WRITE: "true"
          MIGRATION_SYNC_MODE: initial
          MIGRATION_SOURCE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laje_migration_source?sslmode=disable
          MIGRATION_DESTINATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/laje_baseline?sslmode=disable
          MIGRATION_EXPECTED_RESERVATION_REQUEST_COUNT: "39"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/laje-pg17"
          cat > "$RUNNER_TEMP/laje-pg17/pg_dump" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm -i --network host --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD --env PGDATABASE --env PGSSLMODE --env PGAPPNAME postgres:17 pg_dump "$@"
          SH
          cat > "$RUNNER_TEMP/laje-pg17/psql" <<'SH'
          #!/usr/bin/env bash
          exec docker run --rm -i --network host --env PGHOST --env PGPORT --env PGUSER --env PGPASSWORD --env PGDATABASE --env PGSSLMODE --env PGAPPNAME postgres:17 psql "$@"
          SH
          chmod +x "$RUNNER_TEMP/laje-pg17/pg_dump" "$RUNNER_TEMP/laje-pg17/psql"
          export PATH="$RUNNER_TEMP/laje-pg17:$PATH"
          npm run migration:sync-data
          npm run migration:verify-parity

          # Storage guardrails must fail before any destructive destination write.
          if MIGRATION_MAX_SOURCE_PUBLIC_BYTES=1 npm run migration:sync-data; then
            echo "Expected source storage budget guard to block synchronization."
            exit 1
          fi
          test "$(docker run --rm --network host --env PGPASSWORD postgres:17 psql --host localhost --username postgres --dbname laje_baseline --tuples-only --no-align --command 'SELECT count(*) FROM public.league_event_reservation_requests')" = "39"

          if MIGRATION_MAX_DESTINATION_DATABASE_BYTES=1 npm run migration:sync-data; then
            echo "Expected destination storage budget guard to block synchronization."
            exit 1
          fi
          test "$(docker run --rm --network host --env PGPASSWORD postgres:17 psql --host localhost --username postgres --dbname laje_baseline --tuples-only --no-align --command 'SELECT count(*) FROM public.league_event_reservation_requests')" = "39"

          if MIGRATION_DESTINATION_DATABASE_URL="$MIGRATION_SOURCE_DATABASE_URL" npm run migration:sync-data; then
            exit 1
          fi
          if MIGRATION_DESTINATION_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/laje_migration_source?sslmode=disable npm run migration:sync-data; then
            exit 1
          fi
          test "$(docker run --rm --network host --env PGPASSWORD postgres:17 psql --host localhost --username postgres --dbname laje_migration_source --tuples-only --no-align --command 'SELECT count(*) FROM public.league_event_reservation_requests')" = "39"
          if MIGRATION_SOURCE_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/laje_missing_source?sslmode=disable npm run migration:sync-data; then
            exit 1
          fi
          test "$(docker run --rm --network host --env PGPASSWORD postgres:17 psql --host localhost --username postgres --dbname laje_baseline --tuples-only --no-align --command 'SELECT count(*) FROM public.league_event_reservation_requests')" = "39"

  container-image:
    name: Docker Image
    needs: quality
    if: needs.quality.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build application image
        run: docker build --tag laje-api:ci .

      - name: Create isolated Docker network
        run: docker network create laje-ci

      - name: Start PostgreSQL dependency
        run: >-
          docker run -d
          --name laje-postgres
          --network laje-ci
          -e POSTGRES_USER=postgres
          -e POSTGRES_PASSWORD=postgres
          -e POSTGRES_DB=laje_api_test
          postgres:17

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker exec laje-postgres pg_isready -U postgres -d laje_api_test; then
              exit 0
            fi
            sleep 1
          done
          docker logs laje-postgres
          exit 1

      - name: Start API container
        run: >-
          docker run -d
          --name laje-api
          --network laje-ci
          -p 3000:3000
          -e NODE_ENV=test
          -e PORT=3000
          -e DATABASE_URL=postgresql://postgres:postgres@laje-postgres:5432/laje_api_test?sslmode=disable
          -e CORS_ORIGINS=http://localhost:8080
          laje-api:ci

      - name: Validate container health endpoints
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/api/v1/health
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/database

      - name: Validate non-root runtime user
        run: |
          test "$(docker exec laje-api id -u)" != "0"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs laje-api || true
          docker logs laje-postgres || true
