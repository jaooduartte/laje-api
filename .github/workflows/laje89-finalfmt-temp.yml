name: LAJE-89 backend formatter final (temporary)
on:
  push:
    branches: [LAJE-89]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: LAJE-89
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3.9.9 --write src/modules/realtime-read/realtime-read.queries.ts src/modules/realtime-read/realtime-read.routes.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/realtime-read/realtime-read.queries.ts src/modules/realtime-read/realtime-read.routes.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(LAJE-89): format pure query module"
            git push origin HEAD:LAJE-89
          fi
