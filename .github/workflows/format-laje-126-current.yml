name: Format LAJE-126 Current

on:
  push:
    branches:
      - LAJE-126
    paths:
      - ".github/workflows/format-laje-126-current.yml"

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: LAJE-126
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format targeted files
        run: |
          npx prettier --write             src/modules/bracket-preview/bracket-preview.routes.ts             src/operations/apply-operational-migrations.ts             tests/unit/bracket-preview.service.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             src/modules/bracket-preview/bracket-preview.routes.ts             src/operations/apply-operational-migrations.ts             tests/unit/bracket-preview.service.test.ts
          git commit -m "LAJE-126 apply Prettier formatting"
          git push origin HEAD:LAJE-126
