name: Format LAJE-126 (temporary)

on:
  push:
    branches:
      - LAJE-126

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: LAJE-126
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed TypeScript files
        run: npx prettier --write src/modules/notifications/reservation-email.service.ts src/modules/notifications/reservation-email.template.ts tests/unit/reservation-email.template.test.ts
      - name: Commit formatting to LAJE-126
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- src/modules/notifications/reservation-email.service.ts src/modules/notifications/reservation-email.template.ts tests/unit/reservation-email.template.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/modules/notifications/reservation-email.service.ts src/modules/notifications/reservation-email.template.ts tests/unit/reservation-email.template.test.ts
            git commit -m "style(LAJE-126): apply Prettier to email templates"
            git push origin HEAD:LAJE-126
          fi
