name: Format LAJE-126 Final

on:
  push:
    branches:
      - LAJE-126

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: LAJE-126
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format changed files
        run: |
          npx prettier --write             src/config/aws.config.ts             src/config/environment.ts             src/modules/bracket-preview/bracket-preview.runtime.ts             src/modules/bracket-preview/bracket-preview.service.ts             tests/unit/bracket-preview.service.test.ts             docs/operational-workloads.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "LAJE-126 apply final Prettier formatting"
          git push origin HEAD:LAJE-126
