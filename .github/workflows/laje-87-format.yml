name: LAJE-87 Formatter

on:
  push:
    branches:
      - LAJE-87

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: LAJE-87

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format LAJE-87 files
        run: >-
          npx prettier
          src/modules/league-events/league-events.routes.ts
          src/modules/league-events/league-event-conflicts.routes.ts
          src/modules/public-access/public-access.routes.ts
          src/routes/index.ts
          src/openapi/public-content.openapi.ts
          src/openapi/openapi.document.ts
          --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/league-events/league-events.routes.ts \
            src/modules/league-events/league-event-conflicts.routes.ts \
            src/modules/public-access/public-access.routes.ts \
            src/routes/index.ts \
            src/openapi/public-content.openapi.ts \
            src/openapi/openapi.document.ts
          git commit -m "LAJE-87 apply Prettier formatting"
          git push origin HEAD:LAJE-87
