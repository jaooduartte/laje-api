name: Format LAJE-139 (temporary)

on:
  push:
    branches:
      - LAJE-139

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: LAJE-139
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format LAJE-139 files
        run: npx prettier --write scripts/migration/parity-mode.ts scripts/migration/sync-data.ts tests/unit/migration-parity-mode.test.ts docs/migration/cutover-production-laje139.md
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/migration/parity-mode.ts scripts/migration/sync-data.ts tests/unit/migration-parity-mode.test.ts docs/migration/cutover-production-laje139.md
          if ! git diff --cached --quiet; then
            git commit -m "style(LAJE-139): format cutover gates and documentation"
            git push origin HEAD:LAJE-139
          fi
